# Bouwt de site en zet hem op GitHub Pages.
#
# De Pages-bron moet op "GitHub Actions" staan (Settings → Pages → Build and
# deployment → Source). Anders draait bij elke push ook GitHub's eigen
# Jekyll-bouw, die naar dezelfde site publiceert en tegen deze workflow racet.
#
# Clips en Streams (PROJECT_SPEC.md §7): de workflow draait ook op schema.
# Vlak voor de build haalt scripts/fetch-feeds.mjs de streams en de clips op.
# Er wordt niets gecommit; de opgehaalde bestanden gaan van run naar run mee
# in de cache. YouTube wordt maar één keer per uur gevraagd, dat regelt het
# script zelf. De sleutels zijn repository secrets.
#
# De Node-versie komt uit .nvmrc, zodat de Action en de machines nooit uit
# elkaar lopen.
#
# upload-pages-artifact neemt geen bestanden mee waarvan de naam met een punt
# begint. Komt er ooit zo'n bestand bij dat wel online moet, zet dan
# `include-hidden-files: true` bij die stap.

name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Elk kwartier, maar bewust niet op :00, :15, :30 en :45: dat zijn de
  # drukste momenten bij GitHub, en daar worden geplande runs het eerst
  # uitgesteld of weggelaten. In de praktijk start GitHub ze om de één tot vijf
  # uur, en dat is goed zo (§7).
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push wacht netjes op zijn beurt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # De vorige ophaling terug. Zo hoeft YouTube niet bij elke run, en heeft
      # de site nog iets als een API even niet antwoordt.
      - name: Vorige feeds terughalen
        uses: actions/cache/restore@v6
        with:
          path: src/data/generated
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Clips en streams ophalen
        run: npm run feeds
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Feeds bewaren voor de volgende run
        if: hashFiles('src/data/generated/*.json') != ''
        uses: actions/cache/save@v6
        with:
          path: src/data/generated
          key: feeds-${{ github.run_id }}

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # De iOS-app een seintje geven dat er nieuws is.
      #
      # Deze stap draait na elke geslaagde deploy, dus ook na de geplande runs
      # voor Clips en Streams. De Edge Function haalt zelf het manifest op,
      # claimt de nieuwste post in sent_notifications en stuurt alleen als dat
      # claimen lukt. Twee builds achter elkaar leveren dus een melding, en nul
      # als er geen nieuwe post is.
      #
      # Mislukt de aanroep, dan is de site gewoon uitgerold en gaat de run niet
      # rood: een gemiste melding is geen kapotte site. Zonder het geheim slaat
      # de stap zichzelf over, zodat een fork of een test niets probeert.
      #
      # Maar niet rood worden is iets anders dan zwijgen. Bij de zusterapp
      # stond hier eerst `continue-on-error: true` met een `curl -f`, en dan
      # meldt GitHub de stap als geslaagd, ook bij een fout. Daar liepen zo twee
      # groene runs terwijl notify allebei de keren 401 gaf en er niets
      # verstuurd werd; dat kwam pas boven water door het logboek met de hand te
      # lezen. Daarom leest deze stap de statuscode uit en maakt er bij alles
      # buiten de 200-reeks een `::warning::` van. De run blijft groen, de
      # mislukking staat in het overzicht.
      #
      # Alleen de statuscode telt, niet de inhoud van het antwoord. De functie
      # geeft met opzet een 200 bij "al gemeld" en bij "geen toestellen": dat
      # zijn normale uitkomsten die bij elke geplande build voorbijkomen, en
      # daar een waarschuwing van maken zou de echte fouten ondersneeuwen.
      #
      # Het geheim gaat als omgevingsvariabele en niet in de opdrachtregel: zo
      # staat het niet in het commando dat in het logboek terechtkomt. De
      # controle staat in de shell en niet in een `if`, omdat de secrets-context
      # daar niet betrouwbaar beschikbaar is.
      - name: De app een seintje geven
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          if [ -z "$NOTIFY_TOKEN" ]; then
            echo "Geen NOTIFY_TOKEN ingesteld; deze stap doet niets."
            exit 0
          fi

          # Geen -f, want die gooit het antwoord weg en juist daar staat de
          # reden in. || 000 vangt een curl die zelf struikelt, zodat de shell
          # met -e deze stap niet alsnog rood maakt.
          status=$(curl -s -o /tmp/notify-antwoord.txt -w '%{http_code}' -X POST \
            -H "x-notify-token: $NOTIFY_TOKEN" \
            https://izdfwmtrhxkjrzanzgsr.supabase.co/functions/v1/notify) || status=000

          antwoord=$(head -c 400 /tmp/notify-antwoord.txt 2>/dev/null | tr '\n' ' ' || true)
          echo "notify gaf $status"
          echo "$antwoord"

          case "$status" in
            2??) exit 0 ;;
          esac

          echo "::warning title=Melding niet verstuurd::notify gaf $status. $antwoord"
          exit 0
